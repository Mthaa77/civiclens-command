name: Deploy CivicLens frontend to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: https://civiclens-api.tshepisokadiaka83.workers.dev
      CLOUDFLARE_ACCOUNT_ID: a546ddf7657f485b291eeccdf22957a4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Expo web app
        run: npx expo export --platform web

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
